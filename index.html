  <title>WhatsApp 360° Vision</title>

  <meta name="description" content="Central de monitoramento do atendimento no WhatsApp da rede Apaixonados Por Quatro Patas.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="app/tema.css">
  <!-- A pele do mockup (foto, véu, vidro) por cima do tema e da casca. -->

  <!-- A casca importa o cliente da API logo na primeira linha. -->
  <link rel="modulepreload" href="app/dados.js">
